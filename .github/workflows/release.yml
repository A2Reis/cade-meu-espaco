# Gera o instalador e a versão portátil pra Windows e anexa os dois .exe ao
# release do GitHub. Dispara ao subir uma tag v* (ex.: git tag v1.0.0 &&
# git push origin v1.0.0) ou à mão, pela aba Actions, informando uma tag que
# já existe. Se o release da tag já existe, só anexa ou troca os arquivos,
# sem mexer no nome nem no texto dele. Usa o gh, que já vem no runner.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Instalador e portátil pra Windows
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # O electron-builder baixa o Electron que empacota por conta própria.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      # Os .exe levam a version do package.json no nome e nos detalhes do
      # instalador: tag v1.1.0 com package.json em 1.0.0 publicaria o 1.0.0.
      - name: Conferir versão
        shell: bash
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$TAG" ]; then
            echo "::error::A tag $TAG não bate com a versão $versao do package.json."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Empacotar
        run: npx electron-builder --win --publish never

      - name: Anexar ao release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.exe --clobber
