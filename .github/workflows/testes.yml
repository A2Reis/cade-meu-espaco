# Roda os testes de contrato (npm test) em Linux e Windows, nas duas versões
# de Node que o projeto suporta. Os testes não abrem o Electron, então o
# binário dele (uns 100 MB) nem é baixado.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    name: Node ${{ matrix.node }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
